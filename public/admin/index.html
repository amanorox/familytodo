<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4d6">
  <title>親用管理画面 - まいにちTODO</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <h1>📝 TODOの管理</h1>
      <div><div id="admin-date" class="admin-date"></div><div id="admin-connection" class="status-line">接続中...</div></div>
    </header>

    <p id="admin-notice" class="notice" role="status"></p>

    <section class="panel event-panel">
      <h2>🗓 明日の予定・イベント</h2>
      <p class="status-line">日付を選んでイベントを登録すると、その前日に子ども画面へ表示されます。同じ日付には1件登録できます。</p>
      <form id="event-form" class="form-grid">
        <label class="field">日付
          <input id="event-date" name="date" type="date" required>
        </label>
        <label class="field">イベント名
          <input id="event-title" name="title" maxlength="120" required placeholder="例：塾">
        </label>
        <div class="form-actions wide">
          <button class="button primary" type="submit">予定を保存</button>
          <button id="event-delete" class="button secondary" type="button" disabled>この日の予定を削除</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2>📋 きょうのTODO・進みぐあい</h2>
        <span id="completion-count" class="status-line"></span>
      </div>
      <div id="today-tasks" class="task-list"></div>
      <p class="status-line">おやチェックは子ども用TODO画面から入力してください。定期タスクはここで「今日だけお休み」にできます。</p>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2>➕ タスクを登録</h2>
      </div>
      <form id="task-form">
        <div class="form-grid">
          <label class="field wide">やること
            <input id="task-title" name="title" maxlength="120" required placeholder="例：はをみがく">
          </label>
          <label class="field">カテゴリ
            <input id="task-category" name="category" maxlength="60" value="せいかつ">
          </label>
          <label class="field">くり返し
            <select id="repeat-type" name="repeatType">
              <option value="daily">毎日</option>
              <option value="weekly">曜日を指定</option>
              <option value="single">日付を指定（単発）</option>
            </select>
          </label>
          <div id="weekday-field" class="field wide weekday-field" hidden>
            <span>曜日（複数選択できます）</span>
            <div class="weekday-options">
              <label><input type="checkbox" name="repeatDays" value="1">月</label><label><input type="checkbox" name="repeatDays" value="2">火</label>
              <label><input type="checkbox" name="repeatDays" value="3">水</label><label><input type="checkbox" name="repeatDays" value="4">木</label>
              <label><input type="checkbox" name="repeatDays" value="5">金</label><label><input type="checkbox" name="repeatDays" value="6">土</label>
              <label><input type="checkbox" name="repeatDays" value="0">日</label>
            </div>
          </div>
          <label id="single-date-field" class="field single-date-field" hidden>実施日
            <input id="scheduled-date" name="scheduledDate" type="date">
          </label>
        </div>
        <div class="form-actions">
          <button class="button primary" type="submit">保存する</button>
        </div>
        </form>
    </section>

    <section class="panel">
      <h2>🐾 きょうだけタスクを追加</h2>
      <form id="exception-form" class="form-grid">
        <label class="field">やること
          <input id="exception-title" maxlength="120" required placeholder="例：おてつだい">
        </label>
        <label class="field">カテゴリ
          <input id="exception-category" maxlength="60" value="おてつだい">
        </label>
        <div class="field wide"><button class="button primary" type="submit">今日だけ追加する</button></div>
      </form>
    </section>

    <section class="panel">
      <h2>👧 子どもの表示名</h2>
      <div id="child-names" class="child-names"></div>
    </section>

    <section class="panel">
      <h2>🗓 タスクの予定</h2>
      <p class="status-line">ハンドルをドラッグするか、「上へ」「下へ」でTODOリストの順番を変更できます。</p>
      <div id="all-tasks" class="task-list"></div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
