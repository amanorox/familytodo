<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まいにちのTODOリスト</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9800">
<!-- iOS / iPadOS ホーム画面追加サポート -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まいにちTODO">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a href="edit.html" class="edit-link" title="TODOリストを編集する">✏️ 編集</a>
    <h1>📋まいにちのTODO</h1>
    <div class="date-nav">
      <button id="prevDateBtn" class="date-nav-btn" aria-label="前の日へ">◀</button>
      <div class="date-badge" id="todayLabel"></div>
      <button id="nextDateBtn" class="date-nav-btn" aria-label="次の日へ">▶</button>
    </div>
  </header>

  <div class="toolbar">
    <button id="reloadBtn" class="btn btn-reload">🔄 リストをよみこみなおす</button>
    <span id="statusMsg" class="status-msg"></span>
  </div>

  <main>
    <table id="todoTable">
      <thead>
        <tr>
          <th class="col-task">やること</th>
          <th class="col-check child1">こども1<br>チェック</th>
          <th class="col-check child2">こども2<br>チェック</th>
          <th class="col-check parent">おやチェック</th>
        </tr>
      </thead>
      <tbody id="todoBody">
        <!-- JSで生成 -->
      </tbody>
    </table>
    <p id="emptyMsg" class="empty-msg" hidden>
      todo.txt にやることが書かれていません。<br>
      同じフォルダの <code>todo.txt</code> に1行ずつ書いてください。
    </p>
  </main>

  <footer class="app-footer">
    <p>「todo.txt」を編集するとリストの内容を自由に変えられます。チェックは日付が変わると自動でリセットされます。</p>
  </footer>

  <div id="fireworksOverlay" class="fireworks-overlay" hidden>
    <canvas id="fireworksCanvas"></canvas>
    <div class="fireworks-message">
      <div class="fireworks-title">🎉 コンプリート！ 🎉</div>
      <div class="fireworks-sub">ぜんぶできたね、すごい！</div>
      <button id="fireworksCloseBtn" class="btn btn-fireworks-close">とじる</button>
    </div>
  </div>

<script src="todo-diff.js"></script>
<script src="app.js"></script>
</body>
</html>
